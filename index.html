<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallet LARP">
<title>Wallet LARP</title>
<style>
:root{--bg:#f4f4f8;--ink:#111114;--muted:#777781;--line:#e4e4eb;--blue:#087cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:430px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 18px calc(24px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 24px}.top h1{font-size:32px;letter-spacing:-1.2px;margin:0;font-weight:750}.iconbtn{border:0;border-radius:50%;width:42px;height:42px;background:#e6e6ed;font-size:25px;color:#222}
.notice{font-size:11px;letter-spacing:.6px;font-weight:700;color:#7b4d00;background:#fff0ce;border-radius:10px;padding:9px 11px;margin-bottom:20px;text-align:center}
.cards{display:grid;gap:13px}.wallet-card{height:190px;border:0;border-radius:19px;padding:20px;color:white;text-align:left;position:relative;overflow:hidden;box-shadow:0 8px 18px #00000015;isolation:isolate}
.wallet-card:before{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff30;border-radius:50%;right:-70px;top:-100px;box-shadow:0 0 0 25px #ffffff0c,0 0 0 55px #ffffff0b;z-index:-1}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650}.network{font-size:12px;letter-spacing:1.4px;font-weight:800}
.chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#e8d8a8,#a89a73);margin-top:22px;opacity:.95}
.card-name{font-size:18px;font-weight:650;margin-top:14px}.card-number{font-size:13px;letter-spacing:2px;margin-top:5px;opacity:.9}.card-bottom{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end}.card-type{font-size:11px;opacity:.8}.demo-tag{font-size:9px;font-weight:800;letter-spacing:1px;background:#ffffff25;padding:5px 7px;border-radius:5px}
.add{width:100%;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;color:var(--blue);font-weight:650;text-align:left;font-size:16px}
.section-title{font-size:21px;letter-spacing:-.5px;margin:27px 0 12px}.activity{background:#fff;border-radius:16px;padding:0 15px}.transaction{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.transaction:last-child{border-bottom:0}.merchant-icon{width:40px;height:40px;border-radius:50%;background:#f0f0f5;display:grid;place-items:center;font-size:18px}.tx-main{flex:1}.tx-main strong{display:block;font-size:14px}.tx-main small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.amount{font-weight:650;font-size:14px}.muted{color:var(--muted)}
.view{display:none}.view.active{display:block}.back{border:0;background:transparent;color:var(--blue);font-size:16px;padding:6px 0 20px}.detail-card{height:205px;margin-bottom:20px}.panel{background:#fff;border-radius:16px;padding:16px;margin:12px 0}.info-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.info-row:last-child{border:0}.primary{border:0;background:var(--blue);color:#fff;border-radius:13px;padding:14px 16px;font-weight:650;width:100%}.secondary{border:1px solid var(--line);background:white;border-radius:13px;padding:13px;width:100%;margin-top:9px}.form{display:grid;gap:13px}.form label{font-size:13px;color:#555}.form input,.form select{display:block;width:100%;margin-top:6px;border:1px solid #d9d9e1;border-radius:11px;padding:12px;background:white;color:#111}.swatches{display:flex;gap:9px;margin-top:8px}.swatch{width:34px;height:34px;border:3px solid white;outline:1px solid #ddd;border-radius:50%}.swatch.selected{outline:2px solid #087cff}
.overlay{position:fixed;inset:0;background:#f4f4f8;z-index:5;display:none;align-items:center;justify-content:center;padding:25px;text-align:center}.overlay.show{display:flex}.modal-content{width:min(100%,360px)}.face{width:90px;height:90px;border:3px solid #178bff;border-radius:50%;margin:0 auto 25px;display:grid;place-items:center;font-size:42px;color:#178bff;animation:pulse 1.4s infinite}.reader{font-size:76px;margin-bottom:18px}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 12px #087cff14}}
.paycard{border-radius:17px;padding:16px;color:#fff;text-align:left;margin:18px 0;height:120px}.hidden{display:none!important}
@media(min-width:600px){body{padding:20px 0}.app{min-height:calc(100svh - 40px);border-radius:32px;box-shadow:0 15px 60px #00000012;background:var(--bg)}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><h1 id="headerTitle">Wallet</h1><button class="iconbtn" id="editBtn" aria-label="Add card">+</button></header>
  <div class="notice">DEMO WALLET · FICTIONAL CARDS · NO REAL PAYMENTS</div>
  <section class="view active" id="homeView">
    <div class="cards" id="cards"></div>
    <button class="add" id="addBtn">＋ Add a demo card</button>
    <h2 class="section-title">Latest Transactions</h2>
    <div class="activity" id="recent"></div>
    <button class="secondary" id="payBtn">Double-click simulation · Try demo payment</button>
  </section>
  <section class="view" id="detailView">
    <button class="back" id="backBtn">‹ Wallet</button>
    <div id="detailCard"></div>
    <div class="panel" id="details"></div>
    <h2 class="section-title">Transactions</h2><div class="activity" id="history"></div>
    <button class="primary" id="useCardBtn">Use in demo payment</button>
  </section>
  <section class="view" id="addView">
    <button class="back" id="cancelAdd">‹ Cancel</button>
    <h2 class="section-title" style="margin-top:0">Add a demo card</h2>
    <p class="muted" style="font-size:14px;line-height:1.5">Create a fictional card for your LARP wallet. No real account or payment details are accepted.</p>
    <form class="form" id="cardForm">
      <label>Card nickname<input id="nickname" required maxlength="28" placeholder="e.g. Midnight Reserve"></label>
      <label>Cardholder name<input id="holder" required maxlength="30" placeholder="DEMO USER"></label>
      <label>Card style<select id="style"><option value="black">Midnight Black</option><option value="blue">Ocean Blue</option><option value="purple">Royal Purple</option><option value="green">Emerald</option><option value="gold">Champagne Gold</option></select></label>
      <label>Demo card type<select id="type"><option>Credit</option><option>Debit</option><option>Prepaid</option><option>Custom</option></select></label>
      <button class="primary" type="submit">Add to Wallet</button>
    </form>
  </section>
</main>
<div class="overlay" id="paymentOverlay" role="dialog" aria-modal="true">
 <div class="modal-content" id="paymentContent"></div>
</div>
<script>
const palettes={black:["#28282e","#08080b"],blue:["#3f87d9","#123a78"],purple:["#9a72e8","#45236f"],green:["#40a987","#075644"],gold:["#c7a86b","#69502b"]};
const seedTransactions=[
 {merchant:"Coffee House",date:"Today · 9:41 AM",amount:"−$5.80",icon:"☕"},
 {merchant:"Metro Market",date:"Yesterday · 6:22 PM",amount:"−$24.16",icon:"🛍️"},
 {merchant:"Music Store",date:"Oct 5 · 2:10 PM",amount:"−$12.99",icon:"♫"}
];
const defaultCards=[
 {id:1,nickname:"Midnight Reserve",holder:"DEMO USER",style:"black",type:"Credit",number:"•••• 2048",expiry:"12/30",network:"VISA",transactions:seedTransactions},
 {id:2,nickname:"Ocean Everyday",holder:"DEMO USER",style:"blue",type:"Debit",number:"•••• 7316",expiry:"08/29",network:"DEBIT",transactions:[{merchant:"Bookshop",date:"Today · 11:20 AM",amount:"−$18.50",icon:"📚"},{merchant:"Cinema",date:"Oct 6 · 7:05 PM",amount:"−$14.00",icon:"🎬"}]}
];
let cards=loadCards();
let selectedId=cards[0]?.id||1;let nextId=Math.max(2,...cards.map(c=>c.id))+1;let previousView="homeView";
function loadCards(){try{const saved=localStorage.getItem("walletLarpCards");return saved?JSON.parse(saved):defaultCards;}catch{return defaultCards;}}
function saveCards(){try{localStorage.setItem("walletLarpCards",JSON.stringify(cards));}catch{}}
const $=id=>document.getElementById(id);
function cardMarkup(c,extra=""){let p=palettes[c.style]||palettes.black;return `<button class="wallet-card ${extra}" style="background:linear-gradient(135deg,${p[0]},${p[1]})" data-card="${c.id}"><div class="card-top"><span>${escapeHtml(c.nickname)}</span><span class="network">${escapeHtml(c.network||"CARD")}</span></div><div class="chip"></div><div class="card-name">${escapeHtml(c.holder)}</div><div class="card-number">${c.number}</div><div class="card-bottom"><span class="card-type">${escapeHtml(c.type)} · SIMULATED</span><span class="demo-tag">DEMO ONLY</span></div></button>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function txMarkup(t){return `<div class="transaction"><div class="merchant-icon">${t.icon||"•"}</div><div class="tx-main"><strong>${escapeHtml(t.merchant)}</strong><small>${escapeHtml(t.date)}</small></div><div class="amount">${escapeHtml(t.amount)}</div></div>`}
function render(){ saveCards(); $("cards").innerHTML=cards.map(c=>cardMarkup(c)).join("");$("recent").innerHTML=cards.flatMap(c=>c.transactions.slice(0,2).map(t=>({...t,cardName:c.nickname}))).slice(0,4).map(txMarkup).join("")||'<p class="muted">No demo transactions yet.</p>';document.querySelectorAll("[data-card]").forEach(b=>b.addEventListener("click",()=>openDetails(Number(b.dataset.card))));}
function showView(id,title){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(id).classList.add("active");$("headerTitle").textContent=title;$("editBtn").style.visibility=id==="addView"?"hidden":"visible";}
function openDetails(id){selectedId=id;const c=cards.find(x=>x.id===id);if(!c)return;$("detailCard").innerHTML=cardMarkup(c,"detail-card");$("details").innerHTML=`<div class="info-row"><span class="muted">Cardholder</span><strong>${escapeHtml(c.holder)}</strong></div><div class="info-row"><span class="muted">Card number</span><strong>${c.number}</strong></div><div class="info-row"><span class="muted">Expires</span><strong>${c.expiry}</strong></div><div class="info-row"><span class="muted">Card type</span><strong>${escapeHtml(c.type)}</strong></div><div class="info-row"><span class="muted">Account status</span><strong>Demo only</strong></div>`;$("history").innerHTML=c.transactions.map(txMarkup).join("")||'<p class="muted">No transactions yet.</p>';showView("detailView",c.nickname);$("detailCard").querySelector("button").disabled=true;$("detailCard").querySelector("button").style.cursor="default";}
function showAdd(){showView("addView","Add Card")}
$("addBtn").onclick=showAdd;$("editBtn").onclick=showAdd;$("cancelAdd").onclick=()=>showView("homeView","Wallet");$("backBtn").onclick=()=>showView("homeView","Wallet");
$("cardForm").addEventListener("submit",e=>{e.preventDefault();let id=nextId++;let c={id,nickname:$("nickname").value.trim(),holder:$("holder").value.trim().toUpperCase(),style:$("style").value,type:$("type").value,number:"•••• "+String(Math.floor(1000+Math.random()*9000)),expiry:"12/30",network:"DEMO",transactions:[{merchant:"Demo purchase",date:"Just now · SIMULATED",amount:"−$4.25",icon:"✦"}]};cards.unshift(c);selectedId=id;render();e.target.reset();openDetails(id);});
$("useCardBtn").onclick=()=>startPayment(selectedId);$("payBtn").onclick=()=>startPayment(selectedId);
function startPayment(id){selectedId=id;let c=cards.find(x=>x.id===id)||cards[0];if(!c)return;previousView=document.querySelector(".view.active").id;$("paymentOverlay").classList.add("show");$("paymentContent").innerHTML=`<div class="face">⌁</div><h2>Confirm with Face ID</h2><p class="muted">This is a visual simulation only.</p><div class="paycard" style="background:linear-gradient(135deg,${palettes[c.style][0]},${palettes[c.style][1]})"><strong>${escapeHtml(c.nickname)}</strong><div style="margin-top:15px;font-size:13px">${c.number}</div><small>DEMO ONLY</small></div><button class="primary" id="authBtn">Simulate Face ID</button><button class="secondary" id="cancelPay">Cancel</button>`;$("authBtn").onclick=()=>showReader(c);$("cancelPay").onclick=closePayment;}
function showReader(c){$("paymentContent").innerHTML=`<div class="reader">▣</div><h2>Hold Near Reader</h2><p class="muted">Pretending to connect to a payment terminal…</p><div style="margin:22px 0;padding:12px;background:#fff;border-radius:12px;font-weight:700">DEMO PAYMENT · $4.25</div><button class="primary" id="finishPay">Simulate Approved</button><button class="secondary" id="cancelPay">Cancel</button>`;$("finishPay").onclick=()=>{c.transactions.unshift({merchant:"Demo Store",date:"Just now · SIMULATED",amount:"−$4.25",icon:"✦"});render();$("paymentContent").innerHTML=`<div style="font-size:64px;color:#24a36b">✓</div><h2>Demo Approved</h2><p class="muted">No payment was made. This result is fictional.</p><button class="primary" id="donePay">Done</button>`;$("donePay").onclick=closePayment;};$("cancelPay").onclick=closePayment;}
function closePayment(){$("paymentOverlay").classList.remove("show");showView(previousView,previousView==="detailView"?(cards.find(c=>c.id===selectedId)?.nickname||"Card Details"):"Wallet");if(previousView==="detailView")openDetails(selectedId);}
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
